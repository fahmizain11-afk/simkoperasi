    <script>
      // Suppress benign preview iframe private network access and dev-server notices
      (function() {
        function isBenign(arg) {
          if (!arg) return false;
          try {
            var s = typeof arg === 'object' ? (arg.message || arg.stack || String(arg)) : String(arg);
            return s.indexOf('[vite]') !== -1 || 
                   s.indexOf('WebSocket') !== -1 || 
                   s.indexOf('websocket') !== -1 ||
                   s.indexOf('local network') !== -1 ||
                   s.indexOf('Private Network Access') !== -1;
          } catch(e) {
            return false;
          }
        }
        function hasBenign(args) {
          for (var i = 0; i < args.length; i++) {
            if (isBenign(args[i])) return true;
          }
          return false;
        }
        var origError = console.error;
        console.error = function() {
          if (hasBenign(arguments)) return;
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          if (hasBenign(arguments)) return;
          return origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (isBenign(e.message) || isBenign(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isBenign(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
